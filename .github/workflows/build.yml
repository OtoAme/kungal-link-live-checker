# Test → build binaries and image → push to GHCR → trigger a Dokploy redeploy.
# Mirrors nextmoe-infra's build.yml (see that repo's docs/deploy/13-registry-ci.md).
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write            # required to push to GHCR

concurrency:                 # a newer push on the same ref cancels the older run
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:                      # gate the build on green tests (incl. the iron-law guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin dist
          binary=llc
          if [ "$GOOS" = windows ]; then
            binary=llc.exe
          fi
          go build -trimpath -ldflags="-s -w" -o "bin/$binary" ./cmd/server
          if [ "$GOOS" = windows ]; then
            zip -j "dist/llc-${GOOS}-${GOARCH}.zip" "bin/$binary"
          else
            tar -czf "dist/llc-${GOOS}-${GOARCH}.tar.gz" -C bin "$binary"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: dist/*
          archive: false
          if-no-files-found: error

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/kungal/kungal-link-live-checker:latest
            ghcr.io/kungal/kungal-link-live-checker:${{ github.sha }}
          cache-from: type=gha,scope=link-live-checker
          cache-to: type=gha,mode=max,scope=link-live-checker

  deploy:                    # once the image is pushed, tell Dokploy to pull + redeploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:                                                     # secret via env, quoted in run (injection-safe)
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_LINKCHECKER }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_LINKCHECKER not set — image pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
